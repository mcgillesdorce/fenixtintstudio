      <stop offset='0%' stop-color='#0E1018'/>
      <stop offset='55%' stop-color='#0C0C0C'/>
      <stop offset='100%' stop-color='#0A0A0A'/>
    </radialGradient>
    <linearGradient id='body' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#2E2E2E'/>
