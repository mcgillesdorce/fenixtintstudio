<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' viewBox='0 0 1200 800'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='50%' r='65%'>
      <stop offset='0%' stop-color='#0C100A'/>
      <stop offset='100%' stop-color='#0A0A0A'/>
    </radialGradient>
  </defs>
  <rect width='1200' height='800' fill='url(#bg)'/>
  <!-- House silhouette -->
  <g fill='none' stroke='#C9A84C' stroke-opacity='0.2' stroke-width='1.5' transform='translate(600,430) scale(3)'>
    <!-- Roof -->
    <polygon points='0,-68 -75,-20 75,-20'/>
    <!-- Chimney -->
    <rect x='30' y='-72' width='12' height='28'/>
    <!-- Wall -->
    <rect x='-65' y='-20' width='130' height='68'/>
    <!-- Door -->
    <rect x='-12' y='16' width='24' height='32'/>
    <!-- Left window -->
    <rect x='-50' y='-8' width='24' height='20' rx='0.5' stroke-opacity='0.18'/>
    <!-- Right window -->
    <rect x='26' y='-8' width='24' height='20' rx='0.5' stroke-opacity='0.18'/>
    <!-- Window cross bars -->
    <line x1='-38' y1='-8' x2='-38' y2='12' stroke-opacity='0.1'/>
    <line x1='-50' y1='2' x2='-26' y2='2' stroke-opacity='0.1'/>
    <line x1='38' y1='-8' x2='38' y2='12' stroke-opacity='0.1'/>
    <line x1='26' y1='2' x2='50' y2='2' stroke-opacity='0.1'/>
    <!-- Ground line -->
    <line x1='-75' y1='48' x2='75' y2='48' stroke-opacity='0.25'/>
  </g>
  <text x='600' y='278' font-family='system-ui,sans-serif' font-size='11' fill='#C9A84C' text-anchor='middle' letter-spacing='5' opacity='0.5'>FENIX TINT STUDIO</text>
  <text x='600' y='328' font-family='system-ui,sans-serif' font-size='38' font-weight='200' fill='#C9A84C' text-anchor='middle' letter-spacing='8' opacity='0.85'>RESIDENTIAL</text>
  <text x='600' y='364' font-family='system-ui,sans-serif' font-size='13' fill='rgba(255,255,255,0.3)' text-anchor='middle' letter-spacing='4'>Homes · Sunrooms · Sliding Doors · Skylights</text>
  <rect x='440' y='520' width='320' height='36' rx='4' fill='none' stroke='#C9A84C' stroke-opacity='0.15' stroke-width='0.8'/>
  <text x='600' y='543' font-family='system-ui,sans-serif' font-size='10' fill='rgba(255,255,255,0.2)' text-anchor='middle' letter-spacing='3'>REPLACE WITH PROJECT PHOTO</text>
</svg>
