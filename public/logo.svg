<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Fenix Garage Tint Studio badge">
  <title>Fenix Garage Tint Studio</title>
  <defs>
    <!-- Top text arc: clockwise semicircle, apex at y=40 -->
    <path id="topArc" d="M 40,100 A 60,60 0 0,1 160,100"/>
    <!-- Bottom text arc: counterclockwise semicircle, nadir at y=160 -->
    <path id="bottomArc" d="M 40,100 A 60,60 0 0,0 160,100"/>
  </defs>

  <!-- Outer hexagon (flat-top) -->
  <polygon
    points="190,100 145,22 55,22 10,100 55,178 145,178"
    fill="#111111"
    stroke="#C9A84C"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <!-- Inner border ring -->
  <polygon
    points="182,100 140,28.7 60,28.7 18,100 60,171.3 140,171.3"
    fill="none"
    stroke="#C9A84C"
    stroke-width="1.3"
    stroke-linejoin="round"
    opacity="0.55"
  />

  <!-- Car silhouette centered at (100, 63) -->
  <g fill="#C9A84C">
    <!-- Cabin/roof -->
    <path d="M 84,52 C 87,46 92,43 100,43 C 108,43 113,46 116,52 Z"/>
    <!-- Body -->
    <path d="M 70,67 L 73,60 C 77,54 84,51 92,50 L 108,50 C 116,51 123,54 127,60 L 130,67 Z"/>
    <!-- Wheels -->
    <circle cx="82" cy="68" r="5"/>
    <circle cx="118" cy="68" r="5"/>
    <!-- Ground line -->
    <rect x="70" y="73" width="60" height="1.5" rx="0.75" opacity="0.45"/>
  </g>

  <!-- Phoenix -->
  <g fill="#C9A84C">
    <!-- Left wing - multi-feather sweep outward -->
    <path d="M 94,98 C 83,93 65,87 45,90 C 58,81 77,85 91,95 C 76,78 58,72 37,74 C 52,66 72,73 89,86 C 77,69 63,61 44,59 C 60,59 76,67 90,80 Z"/>
    <!-- Right wing - mirror -->
    <path d="M 106,98 C 117,93 135,87 155,90 C 142,81 123,85 109,95 C 124,78 142,72 163,74 C 148,66 128,73 111,86 C 123,69 137,61 156,59 C 140,59 124,67 110,80 Z"/>
    <!-- Body -->
    <ellipse cx="100" cy="106" rx="6" ry="11"/>
    <!-- Neck -->
    <path d="M 96,97 C 97,94 100,93 104,97 Z"/>
    <!-- Head -->
    <circle cx="100" cy="90" r="5.5"/>
    <!-- Crown crest -->
    <path d="M 97,85 L 100,79 L 103,85 Z"/>
    <!-- Tail feathers — center pair -->
    <path d="M 100,116 C 97,128 93,142 89,155 C 94,141 98,127 100,118 Z" opacity="0.95"/>
    <path d="M 100,116 C 103,128 107,142 111,155 C 106,141 102,127 100,118 Z" opacity="0.95"/>
    <!-- Tail feathers — mid pair -->
    <path d="M 98,117 C 91,132 82,147 75,160 C 83,146 93,130 98,117 Z" opacity="0.7"/>
    <path d="M 102,117 C 109,132 118,147 125,160 C 117,146 107,130 102,117 Z" opacity="0.7"/>
    <!-- Tail feathers — outer pair -->
    <path d="M 96,119 C 85,136 71,153 60,168 C 73,152 87,134 96,119 Z" opacity="0.42"/>
    <path d="M 104,119 C 115,136 129,153 140,168 C 127,152 113,134 104,119 Z" opacity="0.42"/>
  </g>

  <!-- FENIX GARAGE — curved top text -->
  <text
    font-family="'Arial Narrow', Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="bold"
    fill="#C9A84C"
    letter-spacing="2.8"
  >
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">FENIX GARAGE</textPath>
  </text>

  <!-- TINT STUDIO — curved bottom text -->
  <text
    font-family="'Arial Narrow', Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="bold"
    fill="#C9A84C"
    letter-spacing="3.8"
  >
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">TINT STUDIO</textPath>
  </text>
</svg>
